name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `uv run` builds the `sim` extension with the runner's `cargo`.
      - name: cargo fmt
        run: cargo fmt --manifest-path sim/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path sim/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path sim/Cargo.toml

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      # On the committed geometry and substations, so no `fetch.sh`.
      - name: pytest
        run: uv run pytest
